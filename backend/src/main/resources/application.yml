server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: carechain-backend
  datasource:
    url: jdbc:h2:mem:carechain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

carechain:
  jwt:
    # 256-bit secure secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: ./uploads/medical-records

logging:
  level:
    root: INFO
    com.carechain: INFO
    org.springframework.security: WARN
